---
layout: default
---

<div class="page-header">
  <div class="page-header__inner">
    <div class="breadcrumb">
      <a href="{{ '/' | relative_url }}">Home</a> › {{ page.title }}
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p>{{ page.description }}</p>
    {% endif %}
  </div>
</div>

<div class="main-content">
  {{ content }}
</div>
