<tr class="post-row">
  <td class="col-icon">⚔</td>
  <td class="col-title">
    {% assign cat = include.post.categories | first %}
    <span class="post-row__category cat-{{ cat }}">{{ cat }}</span>
    <div class="post-row__title">
      <a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
    </div>
    <p class="post-row__excerpt">{{ include.post.excerpt | strip_html | truncate: 120 }}</p>
  </td>
  <td class="col-meta">
    <div class="post-row__date">{{ include.post.date | date: "%d/%m/%Y" }}</div>
    {% if include.post.author %}
    <div class="post-row__author">{{ include.post.author }}</div>
    {% endif %}
  </td>
</tr>
